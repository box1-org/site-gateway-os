# Booted-digest reader for the vm-instance onboarding (box1-docs#138, box1-bootc-status).
# Its only key is image-owned (/usr/share/box1/ssh/authorized_keys/box1-status) and forced
# to one command; sudo allows only that command (/etc/sudoers.d/92-box1-status).
u box1-status - "box1 booted-digest reader (bootc status only)" / /bin/bash
