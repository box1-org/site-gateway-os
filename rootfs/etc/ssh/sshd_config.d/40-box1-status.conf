# Image-owned public keys (box1-docs#138): a user listed under /usr/share/box1/ssh/authorized_keys/
# (only box1-status) is authorized from that root-owned, read-only file, with its forced command.
# .ssh/authorized_keys stays first, so cloud-user keys from qemu-guest-agent work as before.
AuthorizedKeysFile .ssh/authorized_keys /usr/share/box1/ssh/authorized_keys/%u
