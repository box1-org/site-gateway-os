# box1-docs#126: persistent site data under /var (kept by bootc upgrade and rollback).
# PostgreSQL runs as uid 26 and AMQ Broker as uid 185 in their containers.
d /var/lib/box1-site          0755 root root - -
d /var/lib/box1-site/postgres 0700 26   26   - -
d /var/lib/box1-site/broker   0700 185  0    - -
d /run/box1                   0755 root root - -
